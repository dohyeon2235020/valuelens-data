name: 데이터 수집

on:
  schedule:
    - cron: '17 19 * * *'   # 매일 04:17 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행
    inputs:
      only:
        description: '하나만 실행할 소스 ID (비우면 전부: naver_shop, kamis, customs, ecos, kosis)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
          KOSIS_PARAMS: ${{ vars.KOSIS_PARAMS }}
        run: node collect.mjs ${{ github.event.inputs.only }}
      - name: 결과 저장
        run: |
          git config user.name "valuelens-bot"
          git config user.email "valuelens-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "바뀐 데이터 없음"; else git commit -m "데이터 수집 $(date -u +%Y-%m-%d)" && git push; fi
